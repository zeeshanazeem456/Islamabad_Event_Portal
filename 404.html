<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Islamabad Event Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/css/style.css">
  <style>
    .not-found-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      background: #f8fafc;
    }
    .not-found-code {
      font-size: 6rem;
      font-weight: 800;
      font-family: 'Outfit', sans-serif;
      color: #064e3b;
      line-height: 1;
      margin-bottom: 1rem;
    }
    .not-found-title {
      font-size: 1.75rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 0.75rem;
    }
    .not-found-sub {
      color: #64748b;
      max-width: 440px;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="not-found-container">
    <div class="not-found-code">404</div>
    <h1 class="not-found-title">Event Page Not Found</h1>
    <p class="not-found-sub">The page or opportunity you are looking for has moved, expired, or does not exist.</p>
    <a href="/" class="btn-primary" style="display: inline-flex; align-items: center; gap: 0.5rem; text-decoration: none; padding: 0.75rem 1.5rem;">
      Return to Event Portal
    </a>
  </div>
</body>
</html>
